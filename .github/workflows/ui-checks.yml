name: UI checks

# The other half of the gate.
#
# supabase/ already had db-tests.yml: it replays every migration onto a fresh
# Postgres and runs 170+ pgTAP tests. That half of the app has not produced an
# incident in months.
#
# The screens had nothing. Every UI defect this month — a bare "+" nobody could
# read, buttons wrapping onto two lines, an "add" control that scrolled off the
# screen, a phone layout stretched across a laptop, grey text at 2.8:1, a theme
# that stopped halfway through the app — was found by Ali, on his phone, after
# it shipped. He was the only quality check the front end had.
#
# This runs the same thirty-eight audits he can run locally (`npm run audit:ui`):
#
#   wa        the customer-follow-up links never guess a phone number
#   onedef    no concept is DECLARED in two modules — the bug class that made
#             adding a new kind of product impossible, because one file knew
#             eleven units and another knew three
#   journey   drives a real sale on phone, tablet and desktop, and asserts the
#             things that cost money or make the screen unusable
#   grn       receives a shipment and checks the landed cost that comes out —
#             the biggest money calculation in the app
#   offline   records a sale with the network cut and proves it is not lost
#   running   the P&L never claims a net profit it has no running costs for
#   reorder   the At risk lens: who has run out vs who is merely late, with one tap to act
#   direct    stock bought locally or carried in can be received, and reads right
#   newsku    a product with no carton can be created, even after a failed try
#   range     one trip through New SKU makes a whole size range — three sizes
#             under ONE model, which the second size used to make impossible
#   ikea      a whole new KIND of product, set up from nothing on a phone: no
#             jargon, no pack size for something sold one at a time
#   gaps      a half-finished product says what is missing and what it blocks,
#             before the gap costs money at a GRN or a till
#   rename    a name typed wrong can be typed right without losing the stock —
#             the SKU code, the permanent reference, never moves
#   giveaway  a prize leaves stock as marketing at COST: not revenue, not COGS,
#             not the write-off line that means shrinkage
#   bottlesale the THREE ways Ali sells Sosoft, in one order: a mixed carton of
#             6, a whole carton of one colour, and loose bottles. All 204 Sosoft
#             bottles ever sold are recorded as mixed fills, and NO audit had
#             ever driven the whole-carton path — a third of the trade untested
#   late      a product waiting on a LATE or LANDED container is reported as
#             that container, once — never as a reason to order it again. The
#             home screen was telling him to re-buy MVR 1,043 a week of goods
#             already paid for and on the water
#   atcost    a cost typed as the SELLING price is caught at both receiving
#             doors. `price < cost` is strictly less-than, so equal slid through
#             — under a green "You keep MVR 0.00". Three Body Shop tubs are in
#             the ledger at cost = price because of it
#   picker    choosing a product in Stock Ops hides the rest, offers a named way
#             back, and never prints one unit's word twice. The list used to keep
#             every other product under the form in its OWN scroll region, and
#             Sosoft's toggle read `ctn | btl | btl`
#   clearance a line he has STOPPED restocking is cleared to customers who
#             already buy it, never advertised publicly — 7 of the 12 products
#             on the Promo Advisor are dropped lines and every one offered a
#             Facebook post. Read through the CLIPBOARD, because the caption
#             exists only between the tap and the paste
#   followup2 the round never chases a customer who just ordered, and the card
#             never vanishes on a failed refresh. Both were live: three
#             customers who had bought within ten days were still queued, and a
#             swallowed fetch error looked exactly like "nobody to chase"
#   card      the Product Card: every figure on it reconciles to the ledger
#   pricing   the Pricing Tool opens for EVERY product, not just the one that
#             loads by default — it died on every carton-only SKU, and a
#             carton-only product is never offered a per-pack price
#   sellnew   a product you own but never received can be stocked mid-sale —
#             and still cannot be sold from nothing
#   stranded  customers whose whole history is a range we stopped buying are
#             surfaced, with a replacement we actually hold in stock
#   identity  an order shows the customer it belongs to on first paint, even
#             one the browser has never loaded — "Walk-in" means no customer
#   crosssell a category the customer has never bought is offered alongside an
#             order already being packed, and adds through the normal door
#   returned  an order the customer sent back is never reported as paid — the
#             screen Ali photographed, green tick over "Paid MVR 0 of MVR 207"
#   cartonpk  a carton AND some loose packs of the same product, each at its own
#             discounted price, go on one order — the add that used to be refused
#   water     the purchase list counts stock already bought and afloat, and SAYS
#             so — it was asking for 49 cartons already paid for and in transit
#   followup  the round that chases the second order runs itself: one customer
#             at a time, and every send or skip is remembered so nobody is
#             asked twice. 55 of 81 customers bought once — this is the lever
#   pricereview a container that landed dearer is compared with the arrival
#             before it, product by product, in packs and bottles — with a
#             one-tap price that restores the margin, a refusal where that price
#             is above what the shops charge, and no second, higher price
#             waiting behind the first
#   payfirst  money can be recorded the moment an order is confirmed, without
#             walking it through dispatch and delivery first -- and recording it
#             does NOT advance the delivery status. Payment and delivery are two
#             clocks; the ledger always knew that and the screen did not
#   costingseed the simulator SAYS which container it is costing like, and lets
#             him choose another. Freight is charged by volume, so the rate
#             belongs to one container: SH-2026-001 ran at MVR 2,392 per CBM
#             over 8.01 CBM and SH-2026-002 at 5,133 over 2.69. Seeding
#             silently from the newest meant every simulation after 27 August
#             ran at more than double the earlier rate, unnamed — over-costing
#             a full container and arguing him out of good quotes. Drives BOTH
#             containers, so no result can be the one it opened with
#   handover  a new team member can be TOLD how to get in. No email is ever
#             sent — deliberate — but the screen promised one and the dialog
#             closed on save, so the password existed only in the field he had
#             just typed it into: a working account nobody could enter. Adds a
#             viewer, and checks the account is real and confirmed AND that the
#             address, email and password are shown with one tap to copy
#   reach     EVERY sheet: the action stays touchable with the keyboard up, and
#             nothing can drift sideways. The first audit that is an invariant
#             across the app rather than a guard on one screen.
#   material  every in-flow surface actually wears the current theme — run
#             once per MATERIAL (soft's carve, lumen's seam), because the two
#             have opposite physics and one law cannot describe both
#   contrast  every readable word, every theme, both schemes, measured on the
#             RENDERED page rather than read off a token
#
# Every one is proven to fail when the bug it guards is reintroduced; that was
# checked by putting each one back deliberately, and the table of which mutation
# each one caught is in scripts/audit/README.md. (The count used to be written
# out here in words as well and went stale twice — the list above is the record.)

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "scripts/audit/**"
      - "supabase/fixtures/**"
      # A MIGRATION CHANGES WHAT A SCREEN SHOWS. This list once stopped at the
      # fixtures, so a change touching only `supabase/migrations/**` skipped
      # every browser audit — and migration 0204 is the proof: it rewrote
      # get_setup_gaps, which is the entire content of a panel on the Products
      # screen, and CI ran the database tests alone. All the money and stock
      # engines are in Postgres by hard rule 1, so "SQL only" is never "no UI
      # impact" in this app.
      - "supabase/migrations/**"
      - "package.json"
      - ".github/workflows/ui-checks.yml"
  workflow_dispatch: {}

concurrency:
  group: ui-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Cheap things first — a type error or a lint error should not wait on a
      # browser and a database.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (replays every migration from empty)
        run: supabase start

      # The keys below are Supabase's well-known LOCAL demo keys. They are
      # public, they only ever unlock this throwaway container, and production's
      # keys live in Vercel where this workflow cannot reach them.
      - name: Point the app at the local stack
        run: |
          cat > .env.local <<'ENV'
          NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          ENV

      - name: Seed the UI fixture
        run: npm run audit:seed

      - name: Build
        run: npm run build

      # Plain curl rather than `npx wait-on`: npx would fetch an unpinned
      # package at run time, which is a supply-chain surface and a new way for
      # the gate itself to fail. A loop is four lines and has no dependencies.
      - name: Start the built app
        run: |
          npm run start &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/login; then
              echo "app is up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "app did not start within 60s"; exit 1

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Pure logic, no browser and no database — so it runs before anything
      # expensive. A bug here messages the wrong person.
      - name: WhatsApp links — never guess a phone number
        run: npm run audit:wa

      # Also pure logic, also no browser and no database. Reads every export in
      # the source tree and fails if one name is DECLARED in two modules — the
      # bug class that left UnitUom saying eleven units in one file and three in
      # another, so the New Category form could offer neither "set" nor "tub".
      - name: One concept, defined once
        run: npm run audit:onedef

      - name: Journey — a real sale on phone, tablet and desktop
        run: npm run audit:journey

      - name: GRN — receiving a shipment and the money it produces
        run: npm run audit:grn

      - name: Offline — a sale survives losing signal
        run: npm run audit:offline

      - name: Running costs — the P&L tells the truth about them
        run: npm run audit:running-costs

      - name: At risk lens — the destination is worth arriving at
        run: npm run audit:reorder

      - name: Direct receipt — stock that never travelled in a container
        run: npm run audit:direct

      - name: New SKU — a product with no carton, after a failed attempt
        run: npm run audit:newsku

      - name: Size range — one trip through New SKU makes a whole size range
        run: npm run audit:range

      - name: Add IKEA — a whole new kind of product, set up from nothing
        run: npm run audit:ikea

      - name: Setup gaps — a half-finished product says so before it costs money
        run: npm run audit:gaps

      - name: Rename — a name typed wrong can be typed right, keeping the stock
        run: npm run audit:rename

      - name: Giveaway — a prize is marketing at cost, not a sale and not a loss
        run: npm run audit:giveaway

      - name: Sosoft — all three ways he sells it, in one order
        run: npm run audit:bottlesale

      - name: Late shipment — the home screen never says buy what is already bought
        run: npm run audit:late

      - name: At cost — a cost typed as the selling price is caught, both doors
        run: npm run audit:atcost

      - name: Picker — one product on screen, one word per unit, a way back
        run: npm run audit:picker

      - name: Clearance — a dropped line is offered to buyers, never to strangers
        run: npm run audit:clearance

      - name: Follow-up — never chase someone who just bought, never go quiet
        run: npm run audit:followup2

      - name: Product Card — every figure reconciles to the ledger
        run: npm run audit:card

      # A screen with a product picker is not one screen — it is one per
      # product, and the first in the list is the only one anybody ever tests.
      # The Pricing Tool crashed on every carton-only SKU and not on the one
      # that loads by default.
      - name: Pricing Tool — survives every product in the catalogue
        run: npm run audit:pricing

      - name: Sell new product — stock it mid-sale, never sell from nothing
        run: npm run audit:sellnew

      - name: Stranded — customers with nothing left to reorder are surfaced
        run: npm run audit:stranded

      - name: Order identity — the Sales list never guesses whose order it is
        run: npm run audit:identity

      - name: Cross-sell — the cheapest sale is offered at the till
        run: npm run audit:crosssell

      - name: Returned order — never called paid
        run: npm run audit:returned

      - name: A carton and some loose packs — one product, one line
        run: npm run audit:cartonpacks

      - name: On the water — never buy what is already in a container
        run: npm run audit:water

      - name: Follow-up round — the app asks for the second order itself
        run: npm run audit:followup

      # BEFORE the contrast and material sweeps, deliberately: this audit
      # creates the arrival that makes the Price Review panel appear, so those
      # two then measure it. Run after them and it would be the one panel in the
      # app whose words nobody has measured.
      - name: Price review — what the container did to every margin
        run: npm run audit:pricereview

      - name: Paid on order, delivered later — two clocks, not one
        run: npm run audit:payfirst

      - name: Costing seed — the simulator says which container it is costing like
        run: npm run audit:costingseed

      - name: Team hand-over — a new member can be told how to get in
        run: npm run audit:handover

      - name: Reach — the action stays touchable, the screen holds still
        run: npm run audit:reach

      - name: Material — the carve reaches every surface (soft)
        run: npm run audit:material

      # A second material needs a second run: the audit encodes ONE material's
      # physics, and Lumen's is the opposite of the carve's (depth lives in the
      # seam, so a blurred drop shadow is the defect rather than the norm).
      - name: Material — the seam reaches every surface (lumen)
        run: npm run audit:material:lumen

      - name: Contrast — every word, every theme, both schemes
        run: npm run audit:contrast

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
